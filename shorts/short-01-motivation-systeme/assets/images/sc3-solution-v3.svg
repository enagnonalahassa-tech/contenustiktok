<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="42%" r="68%">
      <stop offset="0%"   stop-color="#0A1A2E"/>
      <stop offset="55%"  stop-color="#060E1C"/>
      <stop offset="100%" stop-color="#030610"/>
    </radialGradient>
    <radialGradient id="g3-teal" cx="50%" cy="40%" r="40%">
      <stop offset="0%"   stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="g3-lav" cx="20%" cy="72%" r="38%">
      <stop offset="0%"   stop-color="#C084FC" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="g3-gold" cx="80%" cy="30%" r="30%">
      <stop offset="0%"   stop-color="#FBBF24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="cl3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="sk3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur3-xl"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blur3-md"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <!-- FOND -->
  <rect width="1080" height="1920" fill="url(#bg3)"/>
  <rect width="1080" height="1920" fill="url(#g3-teal)"/>
  <rect width="1080" height="1920" fill="url(#g3-lav)"/>
  <rect width="1080" height="1920" fill="url(#g3-gold)"/>

  <!-- Halos atmosphériques -->
  <ellipse cx="540" cy="820"  rx="400" ry="340" fill="#06B6D4" opacity="0.06" filter="url(#blur3-xl)"/>
  <ellipse cx="200" cy="1500" rx="280" ry="240" fill="#C084FC" opacity="0.07" filter="url(#blur3-xl)"/>
  <ellipse cx="900" cy="400"  rx="240" ry="200" fill="#FBBF24" opacity="0.06" filter="url(#blur3-xl)"/>

  <!-- Grille blueprint légère en fond -->
  <g opacity="0.06">
    <line x1="0" y1="160"  x2="1080" y2="160"  stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="320"  x2="1080" y2="320"  stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="480"  x2="1080" y2="480"  stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="640"  x2="1080" y2="640"  stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="800"  x2="1080" y2="800"  stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="960"  x2="1080" y2="960"  stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="1120" x2="1080" y2="1120" stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="1280" x2="1080" y2="1280" stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="1440" x2="1080" y2="1440" stroke="#06B6D4" stroke-width="1"/>
    <line x1="0" y1="1600" x2="1080" y2="1600" stroke="#06B6D4" stroke-width="1"/>
    <line x1="160"  y1="0" x2="160"  y2="1920" stroke="#06B6D4" stroke-width="1"/>
    <line x1="320"  y1="0" x2="320"  y2="1920" stroke="#06B6D4" stroke-width="1"/>
    <line x1="480"  y1="0" x2="480"  y2="1920" stroke="#06B6D4" stroke-width="1"/>
    <line x1="640"  y1="0" x2="640"  y2="1920" stroke="#06B6D4" stroke-width="1"/>
    <line x1="800"  y1="0" x2="800"  y2="1920" stroke="#06B6D4" stroke-width="1"/>
    <line x1="960"  y1="0" x2="960"  y2="1920" stroke="#06B6D4" stroke-width="1"/>
  </g>

  <!-- ══ CARTES HABITUDES (icônes + texte) ══ -->
  <!-- Carte 1 : Baskets la veille -->
  <g transform="translate(540,380)">
    <rect x="-400" y="-62" width="800" height="124" rx="22"
          fill="#061828" stroke="#06B6D4" stroke-width="1.8" stroke-opacity="0.5" opacity="0.92"/>
    <rect x="-400" y="-62" width="800" height="124" rx="22" fill="#06B6D4" fill-opacity="0.05"/>
    <!-- Icône chaussure (SVG path) -->
    <g transform="translate(-320,0)" filter="url(#glow3-sm)">
      <!-- Semelle -->
      <path d="M-38,22 C-38,30 -20,38 10,38 C40,38 58,30 58,22 L58,16 C58,10 40,6 10,6 C-20,6 -38,10 -38,16 Z"
            fill="#FBBF24" opacity="0.9"/>
      <!-- Dessus de la chaussure -->
      <path d="M-30,6 C-28,-18 -10,-30 18,-28 C38,-26 54,-10 58,6"
            fill="#FBBF24" opacity="0.75"/>
      <!-- Lacets -->
      <line x1="-10" y1="-14" x2="10" y2="-14" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="-8"  y1="-6"  x2="8"  y2="-6"  stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>
    <text x="-30" y="-14" font-family="Inter,sans-serif" font-size="16" font-weight="700"
          fill="rgba(6,182,212,0.8)" letter-spacing="0.12em">VEILLE</text>
    <text x="-30" y="12" font-family="Inter,sans-serif" font-size="28" font-weight="900"
          fill="#F0FDFF">Prépare tes baskets</text>
    <!-- Checkmark -->
    <circle cx="348" cy="0" r="26" fill="#22C55E" opacity="0.88" filter="url(#glow3-sm)"/>
    <path d="M336,-4 L344,6 L360,-12" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Carte 2 : Alarme 6h -->
  <g transform="translate(540,560)">
    <rect x="-400" y="-62" width="800" height="124" rx="22"
          fill="#061828" stroke="#C084FC" stroke-width="1.8" stroke-opacity="0.5" opacity="0.92"/>
    <rect x="-400" y="-62" width="800" height="124" rx="22" fill="#C084FC" fill-opacity="0.05"/>
    <!-- Icône réveil -->
    <g transform="translate(-320,0)" filter="url(#glow3-sm)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#C084FC" stroke-width="5"/>
      <circle cx="0" cy="0" r="26" fill="#C084FC" opacity="0.2"/>
      <!-- Aiguilles -->
      <line x1="0" y1="0" x2="0"   y2="-18" stroke="#C084FC" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="14"  y2="-8"  stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#C084FC"/>
      <!-- Sonnettes en haut -->
      <circle cx="-20" cy="-30" r="8" fill="none" stroke="#C084FC" stroke-width="3"/>
      <circle cx="20"  cy="-30" r="8" fill="none" stroke="#C084FC" stroke-width="3"/>
      <!-- Pieds -->
      <line x1="-14" y1="34" x2="-18" y2="44" stroke="#C084FC" stroke-width="4" stroke-linecap="round"/>
      <line x1="14"  y1="34" x2="18"  y2="44" stroke="#C084FC" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="-30" y="-14" font-family="Inter,sans-serif" font-size="16" font-weight="700"
          fill="rgba(192,132,252,0.8)" letter-spacing="0.12em">6H00</text>
    <text x="-30" y="12" font-family="Inter,sans-serif" font-size="28" font-weight="900"
          fill="#FAF5FF">Alarme fixe chaque jour</text>
    <!-- Checkmark -->
    <circle cx="348" cy="0" r="26" fill="#22C55E" opacity="0.88" filter="url(#glow3-sm)"/>
    <path d="M336,-4 L344,6 L360,-12" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Carte 3 : Engagement social -->
  <g transform="translate(540,740)">
    <rect x="-400" y="-62" width="800" height="124" rx="22"
          fill="#061828" stroke="#FBBF24" stroke-width="1.8" stroke-opacity="0.5" opacity="0.92"/>
    <rect x="-400" y="-62" width="800" height="124" rx="22" fill="#FBBF24" fill-opacity="0.04"/>
    <!-- Icône poignée de main / 2 personnes -->
    <g transform="translate(-320,0)" filter="url(#glow3-sm)">
      <!-- Personne 1 (gauche) -->
      <circle cx="-22" cy="-24" r="14" fill="#FBBF24" opacity="0.85"/>
      <path d="M-32,10 C-38,0 -42,-8 -36,-12" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- Personne 2 (droite) -->
      <circle cx="22" cy="-24" r="14" fill="#FBBF24" opacity="0.85"/>
      <path d="M32,10 C38,0 42,-8 36,-12" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- Poignée de main au centre -->
      <path d="M-36,-12 C-18,-6 18,-6 36,-12" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
    </g>
    <text x="-30" y="-14" font-family="Inter,sans-serif" font-size="16" font-weight="700"
          fill="rgba(251,191,36,0.8)" letter-spacing="0.12em">ENGAGEMENT</text>
    <text x="-30" y="12" font-family="Inter,sans-serif" font-size="28" font-weight="900"
          fill="#FFFBEB">Annonce-le à un pote</text>
    <!-- Checkmark -->
    <circle cx="348" cy="0" r="26" fill="#22C55E" opacity="0.88" filter="url(#glow3-sm)"/>
    <path d="M336,-4 L344,6 L360,-12" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ══ FEMME (tient un clipboard, posture confiante) ══ -->
  <g transform="translate(540,1220)" opacity="0.86">
    <!-- Ombre -->
    <ellipse cx="0" cy="400" rx="128" ry="22" fill="#000" opacity="0.26" filter="url(#blur3-md)"/>

    <!-- Jambes -->
    <path d="M-24,290 L-26,396" stroke="#D4A876" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path d="M24,290 L26,396"  stroke="#D4A876" stroke-width="30" stroke-linecap="round" fill="none"/>
    <!-- Chaussures -->
    <path d="M-26,394 C-40,408 -60,410 -68,402" stroke="#0891B2" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M26,394 C40,408 60,410 68,402"   stroke="#0891B2" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- Jupe -->
    <path d="M-52,160 C-66,196 -68,256 -64,290 L64,290 C68,256 66,196 52,160 Z" fill="url(#sk3)"/>
    <!-- Haut -->
    <path d="M-40,-18 C-54,16 -56,94 -52,160 L52,160 C56,94 54,16 40,-18 Z" fill="url(#cl3)"/>

    <!-- Bras gauche (tient un clipboard) -->
    <path d="M-40,-10 C-54,8 -62,44 -62,80"   stroke="#D4A876" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- Clipboard -->
    <rect x="-120" y="65" width="74" height="96" rx="8" fill="#1A3040" stroke="#06B6D4" stroke-width="2.5"/>
    <!-- Clip en haut -->
    <rect x="-94" y="58" width="22" height="16" rx="4" fill="#06B6D4" opacity="0.8"/>
    <!-- Lignes de texte sur le clipboard -->
    <line x1="-110" y1="95"  x2="-58" y2="95"  stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="-110" y1="113" x2="-70" y2="113" stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.5"/>
    <line x1="-110" y1="131" x2="-64" y2="131" stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.5"/>
    <!-- Checkmarks clipboard -->
    <g stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-113,92 L-108,98 L-98,84"/>
      <path d="M-113,110 L-108,116 L-98,102"/>
      <path d="M-113,128 L-108,134 L-98,120"/>
    </g>

    <!-- Bras droit (levé, confiant) -->
    <path d="M40,-10 C62,10 70,48 68,80"  stroke="#D4A876" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="68" cy="82" r="16" fill="#D4A876"/>

    <!-- Cou -->
    <rect x="-12" y="-46" width="24" height="30" rx="7" fill="#C49A6C"/>

    <!-- Cheveux arrière -->
    <ellipse cx="0" cy="-90" rx="56" ry="66" fill="#2D1040"/>
    <path d="M-54,-122 C-68,-72 -72,8 -68,98"  stroke="#2D1040" stroke-width="34" stroke-linecap="round" fill="none"/>
    <path d="M54,-122 C68,-72 72,8 68,98"       stroke="#2D1040" stroke-width="34" stroke-linecap="round" fill="none"/>

    <!-- Visage -->
    <circle cx="0" cy="-90" r="50" fill="#D4A876"/>
    <ellipse cx="-5" cy="-96" rx="32" ry="36" fill="#E8C49A" opacity="0.42"/>

    <!-- Yeux (confiants, ouverts) -->
    <circle cx="-16" cy="-96" r="7.5" fill="#2D1040"/>
    <circle cx="16"  cy="-96" r="7.5" fill="#2D1040"/>
    <circle cx="-13" cy="-99" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="19"  cy="-99" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="-16" cy="-96" r="4"   fill="#7C4A2A" opacity="0.55"/>
    <circle cx="16"  cy="-96" r="4"   fill="#7C4A2A" opacity="0.55"/>

    <!-- Sourcils neutres/confiants -->
    <path d="M-24,-114 C-16,-120 -7,-118 -5,-113" stroke="#2D1040" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M5,-113 C7,-118 16,-120 24,-114"      stroke="#2D1040" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Nez -->
    <path d="M-4,-82 C0,-76 4,-82" stroke="#B8894E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Sourire confiant -->
    <path d="M-12,-68 C-5,-62 5,-62 12,-68" stroke="#B8894E" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Cheveux avant -->
    <path d="M-54,-116 C-42,-160 -22,-174 0,-174 C22,-174 42,-160 54,-116" fill="#2D1040"/>
    <path d="M-18,-172 C-14,-150 -18,-130 -22,-110" stroke="#2D1040" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Particules -->
  <g filter="url(#glow3-sm)" opacity="0.72">
    <circle cx="90"  cy="300" r="3"   fill="#06B6D4"/>
    <circle cx="240" cy="220" r="2.5" fill="#C084FC"/>
    <circle cx="930" cy="340" r="3"   fill="#FBBF24"/>
    <circle cx="980" cy="190" r="2"   fill="#06B6D4"/>
    <circle cx="120" cy="1400" r="2"  fill="#C084FC" opacity="0.45"/>
    <circle cx="960" cy="1320" r="2.5" fill="#FBBF24" opacity="0.4"/>
    <circle cx="60"  cy="1600" r="2"  fill="#06B6D4" opacity="0.3"/>
  </g>

  <!-- Étincelles -->
  <g filter="url(#glow3)" opacity="0.65">
    <path d="M156,860 L159,850 L162,860 L172,863 L162,866 L159,876 L156,866 L146,863 Z" fill="#FBBF24"/>
    <path d="M900,820 L902,813 L904,820 L911,822 L904,824 L902,831 L900,824 L893,822 Z" fill="#06B6D4"/>
    <path d="M280,920 L282,915 L284,920 L289,921 L284,922 L282,927 L280,922 L275,921 Z" fill="#C084FC"/>
  </g>

  <!-- Étoiles -->
  <circle cx="100" cy="162" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="318" cy="90"  r="1"   fill="white" opacity="0.32"/>
  <circle cx="742" cy="130" r="1.5" fill="white" opacity="0.38"/>
  <circle cx="960" cy="100" r="1"   fill="white" opacity="0.32"/>
  <circle cx="480" cy="150" r="1.5" fill="#06B6D4" opacity="0.55"/>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vig3" cx="50%" cy="50%" r="68%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.76"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#vig3)"/>
</svg>
