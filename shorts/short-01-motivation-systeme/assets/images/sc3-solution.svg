<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg-g" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#071a10"/>
      <stop offset="50%"  stop-color="#050e18"/>
      <stop offset="100%" stop-color="#030608"/>
    </radialGradient>
    <radialGradient id="glow-g1" cx="50%" cy="42%" r="38%">
      <stop offset="0%"   stop-color="#059669" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow-g2" cx="20%" cy="80%" r="35%">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow-grid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-xl">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="glow-line">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Masque en dégradé pour les lignes de grille (fade en haut/bas) -->
    <linearGradient id="fade-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="15%"  stop-color="white" stop-opacity="1"/>
      <stop offset="85%"  stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="mask-fade">
      <rect width="1080" height="1920" fill="url(#fade-v)"/>
    </mask>
  </defs>

  <!-- Fond -->
  <rect width="1080" height="1920" fill="url(#bg-g)"/>
  <rect width="1080" height="1920" fill="url(#glow-g1)"/>
  <rect width="1080" height="1920" fill="url(#glow-g2)"/>

  <!-- Halo central -->
  <ellipse cx="540" cy="840" rx="380" ry="380" fill="#22C55E" opacity="0.09" filter="url(#blur-xl)"/>
  <ellipse cx="200" cy="1500" rx="240" ry="240" fill="#6366F1" opacity="0.08" filter="url(#blur-xl)"/>

  <!-- Grille principale — lignes horizontales -->
  <g mask="url(#mask-fade)" opacity="0.18">
    <line x1="0" y1="80"   x2="1080" y2="80"   stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="160"  x2="1080" y2="160"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="240"  x2="1080" y2="240"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="320"  x2="1080" y2="320"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="400"  x2="1080" y2="400"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="480"  x2="1080" y2="480"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="560"  x2="1080" y2="560"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="640"  x2="1080" y2="640"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="720"  x2="1080" y2="720"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="800"  x2="1080" y2="800"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="880"  x2="1080" y2="880"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="960"  x2="1080" y2="960"  stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1040" x2="1080" y2="1040" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1120" x2="1080" y2="1120" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1200" x2="1080" y2="1200" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1280" x2="1080" y2="1280" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1360" x2="1080" y2="1360" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1440" x2="1080" y2="1440" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1520" x2="1080" y2="1520" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1600" x2="1080" y2="1600" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1680" x2="1080" y2="1680" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1760" x2="1080" y2="1760" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="0" y1="1840" x2="1080" y2="1840" stroke="#22C55E" stroke-width="0.8"/>
    <!-- Lignes verticales -->
    <line x1="80"   y1="0" x2="80"   y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="160"  y1="0" x2="160"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="240"  y1="0" x2="240"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="320"  y1="0" x2="320"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="400"  y1="0" x2="400"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="480"  y1="0" x2="480"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="560"  y1="0" x2="560"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="640"  y1="0" x2="640"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="720"  y1="0" x2="720"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="800"  y1="0" x2="800"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="880"  y1="0" x2="880"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="960"  y1="0" x2="960"  y2="1920" stroke="#22C55E" stroke-width="0.8"/>
    <line x1="1040" y1="0" x2="1040" y2="1920" stroke="#22C55E" stroke-width="0.8"/>
  </g>

  <!-- Lignes accent (plus lumineuses) -->
  <g filter="url(#glow-line)" opacity="0.5">
    <line x1="0" y1="480"  x2="1080" y2="480"  stroke="#22C55E" stroke-width="1.5"/>
    <line x1="0" y1="960"  x2="1080" y2="960"  stroke="#22C55E" stroke-width="1.5"/>
    <line x1="0" y1="1440" x2="1080" y2="1440" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="240"  y1="0" x2="240"  y2="1920" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="540"  y1="0" x2="540"  y2="1920" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="840"  y1="0" x2="840"  y2="1920" stroke="#22C55E" stroke-width="1.5"/>
  </g>

  <!-- Points d'intersection glowants -->
  <g filter="url(#glow-grid)" opacity="0.7">
    <circle cx="240" cy="480"  r="5" fill="#22C55E"/>
    <circle cx="540" cy="480"  r="7" fill="#22C55E"/>
    <circle cx="840" cy="480"  r="5" fill="#22C55E"/>
    <circle cx="240" cy="960"  r="5" fill="#22C55E"/>
    <circle cx="540" cy="960"  r="9" fill="#22C55E"/>
    <circle cx="840" cy="960"  r="5" fill="#22C55E"/>
    <circle cx="240" cy="1440" r="5" fill="#22C55E"/>
    <circle cx="540" cy="1440" r="7" fill="#22C55E"/>
    <circle cx="840" cy="1440" r="5" fill="#22C55E"/>
  </g>

  <!-- Formes géométriques structurées -->
  <!-- Carré central lumineux -->
  <rect x="380" y="720" width="320" height="320"
        fill="none" stroke="#22C55E" stroke-width="2" opacity="0.25" filter="url(#glow-line)"/>
  <rect x="420" y="760" width="240" height="240"
        fill="none" stroke="#22C55E" stroke-width="1" opacity="0.15"/>
  <!-- Croix centrale -->
  <line x1="540" y1="720" x2="540" y2="1040" stroke="#22C55E" stroke-width="1.5" opacity="0.3" filter="url(#glow-line)"/>
  <line x1="380" y1="880" x2="700" y2="880"  stroke="#22C55E" stroke-width="1.5" opacity="0.3" filter="url(#glow-line)"/>

  <!-- Coins décoratifs (blueprint style) -->
  <path d="M60,60 L60,160 M60,60 L160,60"   stroke="#22C55E" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M1020,60 L920,60 M1020,60 L1020,160" stroke="#22C55E" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M60,1860 L60,1760 M60,1860 L160,1860"   stroke="#22C55E" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M1020,1860 L920,1860 M1020,1860 L1020,1760" stroke="#22C55E" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vig3" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.78"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#vig3)"/>
</svg>
