<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg-b" cx="40%" cy="60%" r="70%">
      <stop offset="0%"   stop-color="#060e22"/>
      <stop offset="50%"  stop-color="#04091a"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="glow-b1" cx="42%" cy="58%" r="45%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow-b2" cx="72%" cy="30%" r="35%">
      <stop offset="0%"   stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Horizon glow (sol) -->
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="60%"  stop-color="transparent"/>
      <stop offset="85%"  stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-xl">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="blur-soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <!-- Gradient silhouette -->
    <linearGradient id="sil-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="1080" height="1920" fill="url(#bg-b)"/>
  <rect width="1080" height="1920" fill="url(#glow-b1)"/>
  <rect width="1080" height="1920" fill="url(#glow-b2)"/>
  <rect width="1080" height="1920" fill="url(#horizon)"/>

  <!-- Halos -->
  <ellipse cx="430" cy="1120" rx="360" ry="280" fill="#1d4ed8" opacity="0.12" filter="url(#blur-xl)"/>
  <ellipse cx="800" cy="480"  rx="240" ry="200" fill="#0ea5e9" opacity="0.10" filter="url(#blur-xl)"/>
  <ellipse cx="200" cy="800"  rx="200" ry="160" fill="#6366F1" opacity="0.08" filter="url(#blur-xl)"/>

  <!-- Lignes de sol / horizon (perspective) -->
  <g opacity="0.18">
    <!-- Lignes fuyantes vers le bas -->
    <line x1="540" y1="1100" x2="0"    y2="1920" stroke="#60A5FA" stroke-width="1"/>
    <line x1="540" y1="1100" x2="270"  y2="1920" stroke="#60A5FA" stroke-width="1"/>
    <line x1="540" y1="1100" x2="540"  y2="1920" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="540" y1="1100" x2="810"  y2="1920" stroke="#60A5FA" stroke-width="1"/>
    <line x1="540" y1="1100" x2="1080" y2="1920" stroke="#60A5FA" stroke-width="1"/>
    <!-- Lignes horizontales (sol en damier) -->
    <line x1="0" y1="1300" x2="1080" y2="1300" stroke="#60A5FA" stroke-width="0.8"/>
    <line x1="0" y1="1450" x2="1080" y2="1450" stroke="#60A5FA" stroke-width="0.8"/>
    <line x1="0" y1="1600" x2="1080" y2="1600" stroke="#60A5FA" stroke-width="0.8"/>
    <line x1="0" y1="1750" x2="1080" y2="1750" stroke="#60A5FA" stroke-width="0.8"/>
    <line x1="0" y1="1860" x2="1080" y2="1860" stroke="#60A5FA" stroke-width="0.6"/>
  </g>

  <!-- Silhouette coureur — stylisée, faceless -->
  <!-- Corps principal (penché en avant) -->
  <g transform="translate(480, 680)" opacity="0.72">
    <!-- Ombre au sol -->
    <ellipse cx="80" cy="380" rx="90" ry="18" fill="#000" opacity="0.35" filter="url(#blur-soft)"/>

    <!-- Jambe arrière -->
    <path d="M75,200 C65,260 40,310 20,380" stroke="url(#sil-grad)" stroke-width="22"
          fill="none" stroke-linecap="round"/>
    <!-- Pied arrière -->
    <path d="M20,380 C10,388 -10,390 -20,385" stroke="url(#sil-grad)" stroke-width="14"
          fill="none" stroke-linecap="round"/>

    <!-- Jambe avant -->
    <path d="M85,190 C110,250 140,300 155,370" stroke="url(#sil-grad)" stroke-width="22"
          fill="none" stroke-linecap="round"/>
    <!-- Pied avant -->
    <path d="M155,370 C162,382 178,388 192,382" stroke="url(#sil-grad)" stroke-width="14"
          fill="none" stroke-linecap="round"/>

    <!-- Bras arrière (vers l'avant) -->
    <path d="M70,120 C90,155 120,170 148,155" stroke="url(#sil-grad)" stroke-width="16"
          fill="none" stroke-linecap="round"/>
    <!-- Bras avant (vers l'arrière) -->
    <path d="M80,115 C55,140 28,150 8,140" stroke="url(#sil-grad)" stroke-width="16"
          fill="none" stroke-linecap="round"/>

    <!-- Torse (penché) -->
    <path d="M60,60 C68,100 75,150 80,200" stroke="url(#sil-grad)" stroke-width="28"
          fill="none" stroke-linecap="round"/>

    <!-- Tête -->
    <ellipse cx="50" cy="32" rx="28" ry="32" fill="url(#sil-grad)"/>
  </g>

  <!-- Lignes de vitesse (motion lines) -->
  <g filter="url(#glow-b)" opacity="0.55">
    <line x1="0"   y1="700" x2="380" y2="700" stroke="#60A5FA" stroke-width="2"   stroke-linecap="round"/>
    <line x1="0"   y1="740" x2="320" y2="740" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0"   y1="780" x2="360" y2="780" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0"   y1="820" x2="290" y2="820" stroke="#60A5FA" stroke-width="1"   stroke-linecap="round"/>
    <line x1="0"   y1="860" x2="350" y2="860" stroke="#60A5FA" stroke-width="2"   stroke-linecap="round"/>
    <line x1="0"   y1="900" x2="310" y2="900" stroke="#60A5FA" stroke-width="1"   stroke-linecap="round"/>
    <line x1="0"   y1="940" x2="370" y2="940" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0"   y1="980" x2="300" y2="980" stroke="#60A5FA" stroke-width="1"   stroke-linecap="round"/>
  </g>

  <!-- Particules bleues -->
  <g filter="url(#glow-b)" opacity="0.7">
    <circle cx="100"  cy="400"  r="3"   fill="#60A5FA"/>
    <circle cx="240"  cy="320"  r="2"   fill="#60A5FA"/>
    <circle cx="180"  cy="560"  r="4"   fill="#60A5FA"/>
    <circle cx="900"  cy="380"  r="3"   fill="#60A5FA"/>
    <circle cx="960"  cy="620"  r="2.5" fill="#0ea5e9"/>
    <circle cx="820"  cy="280"  r="2"   fill="#60A5FA"/>
    <circle cx="120"  cy="1200" r="2"   fill="#60A5FA" opacity="0.5"/>
    <circle cx="980"  cy="1100" r="2.5" fill="#60A5FA" opacity="0.5"/>
    <circle cx="350"  cy="1500" r="2"   fill="#60A5FA" opacity="0.3"/>
    <circle cx="730"  cy="1600" r="1.5" fill="#60A5FA" opacity="0.3"/>
  </g>

  <!-- Étoiles / points distants -->
  <circle cx="120"  cy="180"  r="1.5" fill="white" opacity="0.4"/>
  <circle cx="280"  cy="120"  r="1"   fill="white" opacity="0.3"/>
  <circle cx="680"  cy="80"   r="1.5" fill="white" opacity="0.4"/>
  <circle cx="900"  cy="160"  r="1"   fill="white" opacity="0.3"/>
  <circle cx="1020" cy="240"  r="1.5" fill="white" opacity="0.35"/>
  <circle cx="440"  cy="200"  r="1"   fill="white" opacity="0.3"/>
  <circle cx="60"   cy="300"  r="1"   fill="white" opacity="0.25"/>
  <circle cx="750"  cy="260"  r="1.5" fill="white" opacity="0.3"/>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vig4" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#vig4)"/>
</svg>
