<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="45%" r="70%">
      <stop offset="0%"   stop-color="#220A30"/>
      <stop offset="55%"  stop-color="#130620"/>
      <stop offset="100%" stop-color="#080210"/>
    </radialGradient>
    <radialGradient id="g5-rose" cx="50%" cy="48%" r="55%">
      <stop offset="0%"   stop-color="#F43F5E" stop-opacity="0.25"/>
      <stop offset="55%"  stop-color="#C084FC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="g5-gold" cx="50%" cy="75%" r="38%">
      <stop offset="0%"   stop-color="#FBBF24" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="cl5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <linearGradient id="sk5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9D174D"/>
      <stop offset="100%" stop-color="#7F1D4D"/>
    </linearGradient>
    <!-- Gradient bras levés -->
    <linearGradient id="arm-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow5-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow5-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur5-xl"><feGaussianBlur stdDeviation="75"/></filter>
    <filter id="blur5-md"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <!-- FOND -->
  <rect width="1080" height="1920" fill="url(#bg5)"/>
  <rect width="1080" height="1920" fill="url(#g5-rose)"/>
  <rect width="1080" height="1920" fill="url(#g5-gold)"/>

  <!-- Halos atmosphériques -->
  <ellipse cx="540" cy="920"  rx="460" ry="380" fill="#F43F5E" opacity="0.07" filter="url(#blur5-xl)"/>
  <ellipse cx="200" cy="500"  rx="280" ry="240" fill="#C084FC" opacity="0.07" filter="url(#blur5-xl)"/>
  <ellipse cx="880" cy="1400" rx="260" ry="220" fill="#FBBF24" opacity="0.07" filter="url(#blur5-xl)"/>

  <!-- Anneaux concentriques (énergie rayonnante) -->
  <g filter="url(#glow5-lg)" opacity="0.28">
    <circle cx="540" cy="920" r="180" fill="none" stroke="#F43F5E" stroke-width="2"/>
    <circle cx="540" cy="920" r="300" fill="none" stroke="#F43F5E" stroke-width="1.5"/>
    <circle cx="540" cy="920" r="430" fill="none" stroke="#C084FC" stroke-width="1"/>
    <circle cx="540" cy="920" r="580" fill="none" stroke="#FBBF24" stroke-width="0.8"/>
  </g>

  <!-- ══ CŒURS FLOTTANTS ══ -->
  <!-- Chemin de cœur : M 0,6 C 0,-6 -12,-12 -12,-3 C-12,6 0,14 0,14 C0,14 12,6 12,-3 C12,-12 0,-6 0,6 -->
  <g filter="url(#glow5)" opacity="0.75">
    <!-- Grands cœurs -->
    <g transform="translate(200,500) scale(3)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#F43F5E" opacity="0.9"/>
    </g>
    <g transform="translate(880,440) scale(2.4)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#FBBF24" opacity="0.85"/>
    </g>
    <!-- Cœurs moyens -->
    <g transform="translate(140,720) scale(2)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#FDA4AF" opacity="0.8"/>
    </g>
    <g transform="translate(940,650) scale(2)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#F43F5E" opacity="0.75"/>
    </g>
    <g transform="translate(320,380) scale(1.6)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#C084FC" opacity="0.7"/>
    </g>
    <g transform="translate(760,360) scale(1.4)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#FBBF24" opacity="0.7"/>
    </g>
    <!-- Petits cœurs -->
    <g transform="translate(460,320) scale(1.2)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#FDA4AF" opacity="0.65"/>
    </g>
    <g transform="translate(620,300) scale(1.1)">
      <path d="M0,5 C0,-6 -12,-12 -12,-4 C-12,4 0,14 0,14 C0,14 12,4 12,-4 C12,-12 0,-6 0,5 Z"
            fill="#F43F5E" opacity="0.6"/>
    </g>
  </g>

  <!-- Étoiles scintillantes -->
  <g filter="url(#glow5)" opacity="0.72">
    <path d="M290,600 L293,590 L296,600 L306,603 L296,606 L293,616 L290,606 L280,603 Z" fill="#FBBF24"/>
    <path d="M800,540 L803,531 L806,540 L815,543 L806,546 L803,555 L800,546 L791,543 Z" fill="#FBBF24"/>
    <path d="M160,840 L162,834 L164,840 L170,842 L164,844 L162,850 L160,844 L154,842 Z" fill="#FDA4AF"/>
    <path d="M920,780 L922,774 L924,780 L930,782 L924,784 L922,790 L920,784 L914,782 Z" fill="#C084FC"/>
    <path d="M420,430 L422,425 L424,430 L429,431 L424,432 L422,437 L420,432 L415,431 Z" fill="#FBBF24" opacity="0.8"/>
    <path d="M660,400 L662,395 L664,400 L669,401 L664,402 L662,407 L660,402 L655,401 Z" fill="#FDA4AF" opacity="0.8"/>
  </g>

  <!-- ══ FEMME TRIOMPHANTE (bras levés) ══ -->
  <g transform="translate(540,1100)" opacity="0.88">
    <!-- Ombre sol -->
    <ellipse cx="0" cy="410" rx="138" ry="24" fill="#000" opacity="0.26" filter="url(#blur5-md)"/>

    <!-- Jambes (posture ouverte, victorieuse) -->
    <path d="M-28,278 L-38,406" stroke="#D4A876" stroke-width="32" stroke-linecap="round" fill="none"/>
    <path d="M28,278 L38,406"  stroke="#D4A876" stroke-width="32" stroke-linecap="round" fill="none"/>
    <!-- Chaussures (talons) -->
    <path d="M-38,404 C-54,418 -74,420 -82,412" stroke="#9D174D" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M38,404 C54,418 74,420 82,412"    stroke="#9D174D" stroke-width="24" stroke-linecap="round" fill="none"/>
    <!-- Talon aiguille gauche -->
    <line x1="-82" y1="410" x2="-84" y2="430" stroke="#9D174D" stroke-width="5" stroke-linecap="round"/>
    <!-- Talon aiguille droite -->
    <line x1="82" y1="410" x2="84" y2="430" stroke="#9D174D" stroke-width="5" stroke-linecap="round"/>

    <!-- Robe (festive) -->
    <path d="M-58,140 C-80,190 -86,250 -82,278 L82,278 C86,250 80,190 58,140 Z" fill="url(#sk5)"/>
    <!-- Détail robe (brillant) -->
    <path d="M-58,140 C-50,160 -30,170 0,170 C30,170 50,160 58,140 Z" fill="#F43F5E" opacity="0.3"/>

    <!-- Corps/buste -->
    <path d="M-42,-22 C-56,16 -60,90 -58,140 L58,140 C60,90 56,16 42,-22 Z" fill="url(#cl5)"/>
    <!-- Décolleté (petite forme V) -->
    <path d="M-18,-18 L0,4 L18,-18" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- BRAS GAUCHE LEVÉ TRIOMPHALEMENT -->
    <path d="M-42,-14 C-70,-40 -130,-80 -180,-130" stroke="url(#arm-grad)" stroke-width="26" stroke-linecap="round" fill="none" filter="url(#glow5-sm)"/>
    <!-- Main gauche -->
    <circle cx="-184" cy="-134" r="18" fill="#E8C49A" filter="url(#glow5-sm)"/>
    <!-- Confetti/éclats depuis la main gauche -->
    <g filter="url(#glow5-sm)" opacity="0.8">
      <circle cx="-220" cy="-160" r="8" fill="#FBBF24"/>
      <circle cx="-160" cy="-175" r="6" fill="#F43F5E"/>
      <circle cx="-240" cy="-120" r="5" fill="#C084FC"/>
      <path d="M-250,-150 L-245,-145 L-252,-140 Z" fill="#FBBF24"/>
      <path d="M-168,-188 L-163,-180 L-170,-178 Z" fill="#FDA4AF"/>
    </g>

    <!-- BRAS DROIT LEVÉ TRIOMPHALEMENT -->
    <path d="M42,-14 C70,-40 130,-80 180,-130" stroke="url(#arm-grad)" stroke-width="26" stroke-linecap="round" fill="none" filter="url(#glow5-sm)"/>
    <!-- Main droite -->
    <circle cx="184" cy="-134" r="18" fill="#E8C49A" filter="url(#glow5-sm)"/>
    <!-- Confetti depuis la main droite -->
    <g filter="url(#glow5-sm)" opacity="0.8">
      <circle cx="220" cy="-160" r="8" fill="#C084FC"/>
      <circle cx="160" cy="-175" r="6" fill="#FBBF24"/>
      <circle cx="240" cy="-120" r="5" fill="#F43F5E"/>
      <path d="M250,-150 L245,-145 L252,-140 Z" fill="#C084FC"/>
      <path d="M168,-188 L163,-180 L170,-178 Z" fill="#FBBF24"/>
    </g>

    <!-- Cou -->
    <rect x="-13" y="-48" width="26" height="30" rx="7" fill="#C49A6C"/>

    <!-- Cheveux arrière longs -->
    <ellipse cx="0" cy="-92" rx="58" ry="68" fill="#2D1040"/>
    <path d="M-56,-126 C-70,-76 -74,4 -70,106"  stroke="#2D1040" stroke-width="36" stroke-linecap="round" fill="none"/>
    <path d="M56,-126 C70,-76 74,4 70,106"       stroke="#2D1040" stroke-width="36" stroke-linecap="round" fill="none"/>

    <!-- Visage (grand sourire !) -->
    <circle cx="0" cy="-92" r="52" fill="#D4A876"/>
    <ellipse cx="-5" cy="-98" rx="34" ry="38" fill="#E8C49A" opacity="0.42"/>

    <!-- Yeux (fermés en souriant) -->
    <path d="M-23,-100 C-16,-92 -10,-92 -7,-98"  stroke="#2D1040" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M7,-98 C10,-92 16,-92 23,-100"       stroke="#2D1040" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Joues roses -->
    <circle cx="-26" cy="-84" r="12" fill="#F43F5E" opacity="0.2"/>
    <circle cx="26"  cy="-84" r="12" fill="#F43F5E" opacity="0.2"/>

    <!-- Sourcils relevés (heureux) -->
    <path d="M-24,-118 C-16,-126 -6,-124 -4,-118" stroke="#2D1040" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M4,-118 C6,-124 16,-126 24,-118"      stroke="#2D1040" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Nez -->
    <path d="M-4,-84 C0,-78 4,-84" stroke="#B8894E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Grand sourire -->
    <path d="M-18,-68 C-10,-58 10,-58 18,-68" stroke="#B8894E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Dents (blanc) -->
    <path d="M-16,-68 C-8,-60 8,-60 16,-68" fill="white" opacity="0.6"/>

    <!-- Cheveux avant -->
    <path d="M-56,-118 C-44,-162 -22,-178 0,-178 C22,-178 44,-162 56,-118" fill="#2D1040"/>
    <path d="M-18,-176 C-14,-154 -18,-132 -22,-112" stroke="#2D1040" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ══ ICÔNE TÉLÉPHONE (CTA commentaire) ══ -->
  <g transform="translate(540,1620)">
    <!-- Phone -->
    <rect x="-48" y="-72" width="96" height="144" rx="14" fill="#1A0828" stroke="#F43F5E" stroke-width="2.5" stroke-opacity="0.6" opacity="0.92"/>
    <rect x="-38" y="-60" width="76" height="116" rx="8" fill="#0A0414"/>
    <!-- Notification badge -->
    <circle cx="48" cy="-72" r="22" fill="#F43F5E" filter="url(#glow5-sm)"/>
    <text x="48" y="-65" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="900" fill="white">!</text>
    <!-- Bulle commentaire sur l'écran -->
    <rect x="-30" y="-50" width="60" height="42" rx="8" fill="#F43F5E" opacity="0.8"/>
    <path d="M-10,-8 L-16,8 L2,-8 Z" fill="#F43F5E" opacity="0.8"/>
    <!-- Texte dans la bulle -->
    <text x="0" y="-32" text-anchor="middle" font-family="Inter,sans-serif"
          font-size="10" font-weight="900" fill="white">SYSTÈME</text>
    <line x1="-22" y1="-20" x2="22" y2="-20" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="-22" y1="-12" x2="16" y2="-12" stroke="white" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Bouton home -->
    <circle cx="0" cy="56" r="10" fill="none" stroke="#F43F5E" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- Particules -->
  <g filter="url(#glow5-sm)" opacity="0.75">
    <circle cx="88"  cy="360" r="3.5" fill="#F43F5E"/>
    <circle cx="238" cy="280" r="2.5" fill="#C084FC"/>
    <circle cx="918" cy="400" r="3"   fill="#FBBF24"/>
    <circle cx="978" cy="200" r="2"   fill="#FDA4AF"/>
    <circle cx="120" cy="1350" r="2"  fill="#C084FC" opacity="0.45"/>
    <circle cx="958" cy="1300" r="2.5" fill="#FBBF24" opacity="0.4"/>
    <circle cx="60"  cy="1700" r="2"  fill="#F43F5E" opacity="0.3"/>
    <circle cx="1020" cy="1650" r="2" fill="#C084FC" opacity="0.3"/>
  </g>

  <!-- Étoiles distantes -->
  <circle cx="100" cy="155" r="1.5" fill="white" opacity="0.45"/>
  <circle cx="320" cy="88"  r="1"   fill="white" opacity="0.35"/>
  <circle cx="740" cy="125" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="960" cy="100" r="1"   fill="white" opacity="0.35"/>
  <circle cx="480" cy="148" r="1.5" fill="#FDA4AF" opacity="0.62"/>
  <circle cx="620" cy="78"  r="1"   fill="#C084FC" opacity="0.72"/>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vig5" cx="50%" cy="50%" r="68%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#vig5)"/>
</svg>
